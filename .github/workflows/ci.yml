name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_deck.py deck.json
      - run: python scripts/generate_deck.py --output /tmp/deck.json
      - run: python scripts/validate_deck.py /tmp/deck.json
