name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            .cache/github.sqlite3
            .cache/ref-evidence
          key: z0archy-source-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            z0archy-source-v2-${{ runner.os }}-
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_graph.py
      - run: python scripts/validate_graph.py generated/graph.json
      - run: python scripts/generate_github_index.py --cache-ttl 10800
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/generate_ref_evidence.py
      - run: python scripts/generate_deck.py --graph generated/graph.json
      - run: python scripts/validate_deck.py deck.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
